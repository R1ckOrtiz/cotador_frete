<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cotador ItecLog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/logo.png') }}" type="image/png">
</head>
<body>
    <div class="container">

        <div class="logo-container">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo ItecLog" class="logo">
        </div>
        
        <h1>Cotador de Frete</h1>

        <form method="post">
            <label>Comprimento (m): 
                <input type="number" step="0.01" name="comprimento" required>
            </label>
            <label>Largura (m): 
                <input type="number" step="0.01" name="largura" required>
            </label>
            <label>Altura (m): 
                <input type="number" step="0.01" name="altura" required>
            </label>
            <label>Peso real (kg): 
                <input type="number" step="0.01" name="peso_real" required>
            </label>
            <label>Distância (km): 
                <input type="number" step="0.01" name="distancia_km" required>
            </label>
            <label>Valor por kg (R$): 
                <input type="number" step="0.01" name="preco_por_kg" required>
            </label>
            <label>Valor por km (R$): 
                <input type="number" step="0.01" name="preco_por_km" required>
            </label>
            <button type="submit">Calcular</button>
        </form>

        {% if resultado %}
        <div class="resultado">
            <h2>Resultado:</h2>
            <p><strong>Peso cúbico:</strong> {{ resultado.peso_cubico }} kg</p>
            <p><strong>Peso considerado:</strong> {{ resultado.peso_considerado }} kg</p>
            <p><strong>Valor total do frete:</strong> R$ {{ resultado.valor_frete }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
